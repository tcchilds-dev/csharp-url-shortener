name: Build and integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: docker compose -p url-shortener-tests -f compose.test.yaml up -d --wait
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p url-shortener-tests -f compose.test.yaml logs
      - name: Stop test services
        if: always()
        run: docker compose -p url-shortener-tests -f compose.test.yaml down -v
