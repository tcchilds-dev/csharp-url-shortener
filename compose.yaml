services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: URL-shortener-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevOnlyPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:latest
    container_name: URL-shortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
    driver: local
