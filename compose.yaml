services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: url-shortener-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevOnlyPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
